# bytetrack_speed.yaml
tracker_type: bytetrack

# =============================
# ByteTrack 핵심 임계값들 
# =============================

track_high_thresh: 0.3
# ✅ "확실한 검출만" 메인 추적에 쓰는 기준(confidence)
# [범위] 0.0 ~ 1.0
# [추천] 0.4 ~ 0.7
# - conf >= track_high_thresh 인 박스만 "메인 추적 대상"으로 인정
# - 값 ↑(0.6~0.8): 오탐/유령 트랙↓, ID 안정↑  BUT 그늘/비/원거리에서 끊김↑
# - 값 ↓(0.3~0.5): 놓침/끊김↓           BUT 오탐/ID 스위치↑

track_low_thresh: 0.05
# ✅ "약한 검출(저신뢰)"도 후보로 살리는 기준
# [범위] 0.0 ~ 1.0
# [추천] 0.05 ~ 0.2
# [규칙] track_low_thresh <= track_high_thresh  (반드시!)
# - track_low_thresh ~ track_high_thresh 사이는 "보조 후보"로만 사용 (메인 타겟 아님)
# - 잠깐 가려져 conf가 떨어진 순간에도, 이 후보로 기존 트랙을 이어붙일 수 있음
# - 값 ↑(0.15~0.3): 후보↓ → 오매칭↓  BUT 끊김↑
# - 값 ↓(0.03~0.1): 후보↑ → 끊김↓    BUT 노이즈/오탐 매칭↑

new_track_thresh: 0.25
# ✅ "새로운 트랙(ID)"를 만들 때 필요한 최소 conf
# [범위] 0.0 ~ 1.0
# [추천] 0.5 ~ 0.8
# [권장관계] 보통 new_track_thresh >= track_high_thresh (새 ID는 더 엄격하게)
# - 기존 트랙과 매칭 못한 검출이 conf >= new_track_thresh 이면 새 ID 생성
# - 값 ↑(0.7~0.9): 유령 트랙↓        BUT 새 차량(작은/어두운) 시작 놓칠 수 있음
# - 값 ↓(0.4~0.6): 새 트랙 잘 생김    BUT ID가 과하게 쪼개짐(분할)↑

track_buffer: 180
# ✅ 트랙이 잠깐 안 보일 때 "몇 프레임까지 살아있게" 유지할지(끊김 버티는 시간)
# [범위] 0 ~ (정수, 프레임 수)
# [추천] 30fps 기준:
#   - 30~90  (1~3초)  : 일반
#   - 90~150 (3~5초)  : 가림/그늘/비로 끊김 심할 때(속도측정에 유리)
# - fps=30이면 105프레임 ≈ 3.5초 동안 검출이 없어도 트랙 유지 시도
# - 값 ↑(120~180): 끊김↓(속도측정 유리) BUT 다른 차량과 잘못 붙을 위험↑
# - 값 ↓(30~60) : 오매칭↓              BUT 끊김↑(속도 표시 끊김)

match_thresh: 0.8
# ✅ "이 검출은 저 트랙이다" 매칭할 때 필요한 유사도 기준(엄격함)
# [범위] 0.0 ~ 1.0
# [추천] 0.6 ~ 0.9
# - (보통) IoU(겹침) + motion(칼만 예측) 기반 매칭 점수가 이 이상이면 연결
# - 값 ↑(0.85~0.95): 오매칭/ID스위치↓  BUT 끊김↑(매칭 실패↑)
# - 값 ↓(0.5~0.7) : 끊김↓              BUT 엉뚱한 차랑 붙을 위험↑

fuse_score: True
# ✅ 매칭/선택에서 "score(confidence)"를 IoU/거리와 함께 더 반영할지
# [값] True / False
# - True : conf가 높은 박스를 더 선호(가짜↓) BUT conf 출렁이면 끊김↑ 가능
# - False: conf 영향 줄이고 기하/모션 위주(어두운 환경에서 이어질 때 도움될 때도 있음)
